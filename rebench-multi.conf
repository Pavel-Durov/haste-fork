# ReBench configuration for demonstrating multitime vs mean-of-means difference

default_experiment: FibonacciMulti
default_data_file: benchmark.data

runs:
    invocations: 3  # 3 separate invocations
    iterations: 10 # PlainText adapter expects 1, the benchmark handles iterations
    min_iteration_time: 1

benchmark_suites:
    FibonacciMultiSuite:
        gauge_adapter: PlainText
        command: "benchmarks/fibonacci_multi.py %(benchmark)s %(iterations)s"
        benchmarks:
            - "20"  # Medium speed
            - "30"  # Slow speed
            - "40"  # Very slow speed
        variable_values:
            iterations: [10]  # Different iteration counts per invocation

executors:
    python:
        executable: python3

experiments:
    FibonacciMulti:
        description: Demonstrates difference between averaging methods
        suites:
            - FibonacciMultiSuite
        executions:
            - python
