# ReBench configuration for testing haste with Fibonacci benchmarks

default_experiment: Fibonacci
default_data_file: benchmark.data

runs:
    invocations: 10  # Run the benchmark 3 times
    iterations: 10    # Each invocation runs 5 iterations
    min_iteration_time: 1  # Set to 1ms minimum instead of default 50ms

benchmark_suites:
    FibonacciSuite:
        gauge_adapter: Time
        command: "benchmarks/fibonacci.py %(benchmark)s"
        benchmarks:
            - "10"  # Fast: ~3-5ms
            - "20"  # Medium: ~30-50ms
            - "30"  # Slow: ~300-600ms

executors:
    python:
        executable: python3
    pypy:
        executable: /opt/homebrew/bin/pypy

experiments:
    Fibonacci:
        description: Fibonacci recursion benchmark with multiple samples
        suites:
            - FibonacciSuite
        executions:
            - python
            - pypy